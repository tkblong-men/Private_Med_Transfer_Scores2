            const filtered = allData.filter(item => {
                const matchKeyword = (item.校系名稱 || '').toLowerCase().includes(keyword) || 
                                     (item.校系代碼 || '').toLowerCase().includes(keyword);
                const matchYear = year === 'all' || item.學年度 == year;
                const matchGrade = grade === 'all' || item.年級 === grade;
                const matchSubject = subject === 'all' || item.採計種類 === subject;
                return matchKeyword && matchYear && matchGrade && matchSubject;
            });
            renderTable(filtered);
        }

        [searchInput, yearFilter, gradeFilter, subjectFilter].forEach(el => 
            el.addEventListener('input', filterData)
        );

        // --- Tab 2: 圖表邏輯 ---
        let chartsRendered = false;
        function renderCharts() {
            if (chartsRendered) return;
            chartsRendered = true;

            // 處理圖表1資料：歷年名額
            const yearsList = ['109', '110', '111', '112', '113', '114'];
            const quotaData = [];
            const admitData = [];

            yearsList.forEach(y => {
                let qSum = 0;
                let aSum = 0;
                allData.filter(d => d.學年度 == y).forEach(d => {
                    if (Number.isInteger(d.招生名額)) qSum += d.招生名額;
                    if (Number.isInteger(d.錄取名額)) aSum += d.錄取名額;
                });
                quotaData.push(qSum);
                admitData.push(aSum);
            });

            new Chart(document.getElementById('quotaChart'), {
                type: 'bar',
                data: {
                    labels: yearsList.map(y => y + '學年'),
                    datasets: [
                        { label: '招生總名額', data: quotaData, backgroundColor: '#3b82f6', borderRadius: 4 },
                        { label: '錄取總名額', data: admitData, backgroundColor: '#10b981', borderRadius: 4 }
                    ]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });

            // 處理圖表2資料：考科圓餅圖
            const subjectCount = {};
            allData.forEach(d => {
                const s = d.採計種類;
                if (s) {
                    subjectCount[s] = (subjectCount[s] || 0) + 1;
                }
            });
            const subjectLabels = Object.keys(subjectCount);
            const subjectValues = Object.values(subjectCount);

            new Chart(document.getElementById('subjectChart'), {
                type: 'doughnut',
                data: {
                    labels: subjectLabels,
                    datasets: [{
                        data: subjectValues,
                        backgroundColor: ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- Tab 3: 簡章與試題 ---
        const docTableBody = document.getElementById('docTableBody');
        docsData.forEach(doc => {
            if (!doc.學年) return;
            const row = document.createElement('tr');
            row.className = 'hover:bg-blue-50/50';
            row.innerHTML = `
                <td class="p-4 text-sm font-semibold text-gray-700">${doc.學年}</td>
                <td class="p-4 text-sm text-gray-700">${doc.主辦學校 || '-'}</td>
                <td class="p-4 text-sm">
                    <span class="inline-block bg-blue-100 text-blue-700 px-3 py-1 rounded cursor-pointer hover:bg-blue-200 transition-colors">
                        ${doc.簡章 || '查看簡章'}
                    </span>
                </td>
                <td class="p-4 text-sm">
                    <span class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded cursor-pointer hover:bg-green-200 transition-colors">
                        ${doc['試題&解答'] || '歷屆試題'}
                    </span>
                </td>
            `;
            docTableBody.appendChild(row);
        });

        // 初始化
        renderTable(allData);
    </script>
</body>
</html>
